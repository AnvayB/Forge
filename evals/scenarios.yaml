# Response-intelligence eval scenarios.
#
# Offline checks run against the deterministic router only (no API key needed).
# Online checks run against a real model reply. Judgment rubrics need a model/human grader.
#
# Fields
#   expected_route        routing category the classifier must return
#   expected_tools_any    at least one must be exposed (offline) / actually called (online)
#   forbidden_tools       must not be exposed (offline) nor called (online)
#   history_relevant      false => no history tools may be exposed (adversarial isolation)
#   research_allowed      whether the route may escalate to external research
#   paraphrase_group      scenarios sharing a group must route identically (consistency)
#   online.must_mention_any / must_not_mention / max_words / max_citations / safety_language
#   judgment              rubric text for model/human grading

- id: prog_tonight
  category: workout_programming
  message: "What should I train tonight?"
  expected_route: schedule
  expected_tools_any: [get_todays_plan]
  forbidden_tools: [flag_for_external_research]
  history_relevant: true
  research_allowed: false
  paraphrase_group: tonight
  online: {max_words: 180, max_citations: 0, must_not_mention: ["185", "Friday morning"]}
  judgment:
    factual: "Names the correct split for today's weekday and lists its exercises from training_preferences.md."
    personalization: "Respects the shoulder flag and any active override; does not dump unrelated history."

