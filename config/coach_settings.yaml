timezone: America/Los_Angeles

review_interval_days: 30

analytics_locked: true

daily_checkin_time: "22:00"

morning_workout_reminder_time: "10:00"

cardio_days: [Monday, Wednesday, Friday]

default_cardio_goal_minutes: 35

target_checkpoint_date: "2026-12-01"

calorie_goal: 2335

protein_goal_g: 160

protein_adherence_threshold_g: 145

carbs_goal_g: 300

fat_goal_g: 55

preferred_model: gpt-5.5

response_style: concise

workout_proof_required: true

nutrition_checkin_required: true

progress_photo_interval_days: 30

measurement_interval_days: 30

# Response intelligence. External research uses the OpenAI built-in web_search tool with
# the same API key; it only runs when the router allows it and the curated knowledge base
# has no coverage, and it is capped at one search per reply.
external_research_enabled: true

external_research_timeout_seconds: 8.0

# Max function-calling rounds per reply (each round may execute several tools).
max_tool_rounds: 4

# Progression guidance (all optional; defaults live in analytics/progression.py).
# rep_targets:
#   lateral raise: {top: [12, 20], backoff: [12, 20]}
# equipment_increments: {dumbbell: 2.5, barbell: 5, machine: 5, cable: 5}   # lbs per step
# hits_to_progress: 2        # sessions at the top of the range before adding weight
# sleep_normal_minutes: 420  # at/above: train as scheduled
# sleep_low_minutes: 360     # below: trim volume, no top-set pushes
